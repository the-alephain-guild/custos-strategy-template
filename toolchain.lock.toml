# The strategy toolkit is published as a digest-pinned OCI artifact on GitHub
# Container Registry, not on PyPI. `make setup` downloads exactly the bytes
# named here into .toolchain/wheels/, checks every digest, and pyproject.toml
# installs the wheels from there. To upgrade, change this table and the two wheel
# paths in pyproject.toml together, then run `make setup`.
schema_version = 1

[toolkit]
version = "0.1.0rc7"
registry = "ghcr.io"
repository = "the-alephain-guild/custos-strategy-toolkit"
manifest_digest = "sha256:ecedc35e9d599314101ec0ff18734d7bf560af9f5b6437928b0d5b62f13d2dd8"
wheels = [
    "custos_strategy_toolkit-0.1.0rc7-py3-none-any.whl",
    "custos_strategy_toolkit_nautilus-0.1.0rc7-py3-none-any.whl",
]

# NautilusTrader wheels are published for these platforms only.
[platforms]
supported = [
    { system = "Darwin", machine = "arm64" },
    { system = "Linux", machine = "aarch64" },
    { system = "Linux", machine = "x86_64" },
]

# The Custos runner image used by `make start`: the published release, pinned by
# the digest of its multi-platform index so the tag cannot move under it. It must
# report this package version and accept the deployment spec version
# tools/runner/spec.py renders, which make start asks it for. The revision is the
# Custos commit the release was built from.
[runner]
image = "ghcr.io/the-alephain-guild/custos:v0.3.0@sha256:5383136e5d1e4bed205ccb19e6e2a997dcb5a4d51867605876e7f5c984444809"
package_version = "0.3.0"
revision = "415abf1e37ea866612173c2fe4802d2884277319"
