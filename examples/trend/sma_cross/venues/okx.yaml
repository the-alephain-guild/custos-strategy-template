# The same strategy on OKX perpetual swaps: `make start STRATEGY=examples/trend/sma_cross
# VENUE=okx`. A venue profile may set only trading, platforms, warmup, backtesting
# and risk.trade.sl_tp_mode; the parameters and the rest of risk stay in
# config.yaml, the same on every exchange.
trading:
  connector:
    value: "okx_perpetual"
  pairs:
    value: ["BTC-USDT"]
  leverage:
    value: 1
