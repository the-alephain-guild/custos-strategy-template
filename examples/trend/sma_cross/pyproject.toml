[project]
name = "strategy-sma-cross"
version = "0.1.0"
description = "Long when a fast moving average crosses above a slow one; out when it crosses back. A worked example, not a trading idea."
requires-python = ">=3.12,<3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refinement"]

[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "refinement/config.yaml"

# Each strategy is tested in its own process: every strategy's code lives in a
# package named `refinement`, so two of them cannot share one interpreter.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
