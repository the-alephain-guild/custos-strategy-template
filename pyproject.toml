[project]
name = "custos-strategy-template"
version = "0.1.0"
description = "A repository of trading strategies for Custos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "custos-strategy-toolkit==0.1.0rc7",
    "custos-strategy-toolkit-nautilus==0.1.0rc7",
    "nautilus-trader @ https://github.com/the-alephain-guild/nautilus_trader/releases/download/guild-v2.0.0rc5%2Bsodex.1/nautilus_trader-2.0.0rc5%2Bsodex.1-cp312-cp312-macosx_11_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "nautilus-trader @ https://github.com/the-alephain-guild/nautilus_trader/releases/download/guild-v2.0.0rc5%2Bsodex.1/nautilus_trader-2.0.0rc5%2Bsodex.1-cp312-cp312-manylinux_2_39_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "nautilus-trader @ https://github.com/the-alephain-guild/nautilus_trader/releases/download/guild-v2.0.0rc5%2Bsodex.1/nautilus_trader-2.0.0rc5%2Bsodex.1-cp312-cp312-manylinux_2_39_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false
# NautilusTrader has wheels for these three platforms and no others.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
custos-strategy-toolkit = { path = ".toolchain/wheels/custos_strategy_toolkit-0.1.0rc7-py3-none-any.whl" }
custos-strategy-toolkit-nautilus = { path = ".toolchain/wheels/custos_strategy_toolkit_nautilus-0.1.0rc7-py3-none-any.whl" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
