# Answers for `make new-strategy`, which runs `copier copy` on this repository.
# The template itself lives in templates/strategy/; keeping this file at the
# repository root lets copier record which commit a strategy was made from, so
# `copier update` can bring later template changes into an existing strategy.
_subdirectory: templates/strategy
_answers_file: .copier-answers.yml
_min_copier_version: "9.0.0"

name:
  type: str
  help: Strategy name (lowercase letters, digits and underscores)
  validator: >-
    {% if not (name | regex_search('^[a-z][a-z0-9_]*$')) %}use lowercase letters, digits and underscores, starting with a letter{% endif %}

category:
  type: str
  help: Category directory under strategies/, for example trend or mean_reversion
  default: trend
  validator: >-
    {% if not (category | regex_search('^[a-z][a-z0-9_]*$')) %}use lowercase letters, digits and underscores, starting with a letter{% endif %}

description:
  type: str
  help: One sentence describing what the strategy trades on
  default: ""

engine:
  type: str
  help: Trading engine the strategy is written for
  choices:
    NautilusTrader (Python): nautilus
    NautilusTrader (Rust): nautilus-rs
  default: nautilus
  validator: >-
    {% if engine == 'nautilus-rs' %}Custos cannot run compiled strategies yet; choose nautilus{% endif %}

# The exchanges a Custos runner can trade on. Adding one here also needs a market
# data source in tools/data/ and, if the exchange wants account settings, a venue
# block in templates/strategy/run.yaml.jinja; docs/exchanges.md walks through it.
connector:
  type: str
  help: Exchange and market
  choices:
    Binance USDⓈ-M perpetual: binance_perpetual
    Binance spot: binance
    OKX perpetual swap: okx_perpetual
    OKX spot: okx
    SoDEX perpetual: sodex_perpetual
    SoDEX spot: sodex
  default: binance_perpetual

# Common pairs for the chosen market, in the exchange's own spelling: SoDEX names
# its spot pairs after its v-prefixed tokens and quotes its perpetuals in USD.
# Custos trades spot only with BTC or ETH as the base asset, so spot lists no more.
pair:
  type: str
  help: Trading pair; choose "other" to type one that is not listed
  choices: |-
    {%- if connector == 'sodex' %}
    - vBTC_vUSDC
    - vETH_vUSDC
    {%- elif connector == 'sodex_perpetual' %}
    - BTC-USD
    - ETH-USD
    - SOL-USD
    - XRP-USD
    - DOGE-USD
    {%- elif connector in ['binance', 'okx'] %}
    - BTC-USDT
    - ETH-USDT
    {%- else %}
    - BTC-USDT
    - ETH-USDT
    - SOL-USDT
    - XRP-USDT
    - DOGE-USDT
    {%- endif %}
    - other
  default: "{{ {'sodex': 'vBTC_vUSDC', 'sodex_perpetual': 'BTC-USD'}.get(connector, 'BTC-USDT') }}"

custom_pair:
  type: str
  help: >-
    {%- if connector == 'sodex' %}Pair as SoDEX lists it, for example vETH_vUSDC
    {%- elif connector == 'sodex_perpetual' %}Pair as SoDEX lists it, for example AVAX-USD
    {%- else %}Pair as BASE-QUOTE in capitals, for example AVAX-USDT{% endif %}
  when: "{{ pair == 'other' }}"
  validator: >-
    {%- if connector == 'sodex' -%}
      {%- if not (custom_pair | regex_search('^v(BTC|ETH)_vUSDC$')) -%}
        SoDEX spot pairs are written like vBTC_vUSDC, and Custos trades spot only in vBTC or vETH
      {%- endif -%}
    {%- elif connector == 'sodex_perpetual' -%}
      {%- if not (custom_pair | regex_search('^[A-Z0-9]+-USD$')) -%}
        SoDEX perpetuals are written BASE-USD in capitals, for example AVAX-USD
      {%- endif -%}
    {%- elif not (custom_pair | regex_search('^[A-Z0-9]+-[A-Z0-9]+$')) -%}
      write the pair as BASE-QUOTE in capitals, for example AVAX-USDT
    {%- elif connector in ['binance', 'okx'] and custom_pair.split('-')[0] not in ['BTC', 'ETH'] -%}
      Custos trades spot only with BTC or ETH as the base asset
    {%- elif connector == 'okx_perpetual' and custom_pair.split('-')[1] not in ['USDT', 'USDC'] -%}
      OKX perpetuals trade here only against USDT or USDC
    {%- endif -%}

trading_pair:
  type: str
  default: "{{ custom_pair if pair == 'other' else pair }}"
  when: false

# What run.yaml needs to know about the exchange, worked out once here.
exchange:
  type: str
  default: "{{ connector.split('_')[0] }}"
  when: false

settlement_currency:
  type: str
  default: "{{ 'vUSDC' if exchange == 'sodex' else trading_pair.split('-')[1] }}"
  when: false

bar_type:
  type: str
  help: Bar the strategy decides on, as STEP-UNIT
  default: 1-HOUR
  validator: >-
    {% if not (bar_type | regex_search('^[0-9]+-(MINUTE|HOUR|DAY)$')) %}write the bar as STEP-UNIT, for example 15-MINUTE or 1-HOUR{% endif %}

class_prefix:
  type: str
  default: "{{ name.split('_') | map('capitalize') | join }}"
  when: false
